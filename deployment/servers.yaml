# DocuFusion Deployment Server Configuration
# ===========================================
# Server inventory for deployment orchestration

servers:
  # spare-2 — primary DocFusion host (Contabo vmi3379061)
  spare-2:
    host: "161.97.124.202"
    user: "root"
    app_dir: "/root/docfusion"
    env_file: "/root/docfusion/.env"
    description: "spare-2 — DocFusion API + frontend + timers"
    services:
      - docfusion-api
      - docfusion-frontend
    timers:
      - docfusion-daily-crawl.timer
      - docfusion-digest.timer
      - docfusion-memory-cleanup.timer

  # datacraft-ours — legacy slot (37.60.225.7 / ours.datacraft.systems)
  datacraft-ours:
    host: "37.60.225.7"
    user: "root"
    app_dir: "/root/docfusion"
    env_file: "/root/docfusion/.env"
    description: "datacraft — DataCraft Systems production slot"
    services:
      - docfusion-api
      - docfusion-frontend
    timers:
      - docfusion-daily-crawl.timer
      - docfusion-digest.timer
      - docfusion-memory-cleanup.timer

# Deployment defaults
deployment:
  default_server: "spare-2"
  ssh:
    port: 22
    key: "~/.ssh/id_rsa"

# Shared infrastructure (not per-server — accessed from all app hosts)
shared_infra:
  db_host: "144.91.122.29"        # db.lindela.io — PostgreSQL 17 PRIMARY
  litellm_url: "http://62.169.25.77:4000/v1"
  searxng_url: "http://84.247.181.100:8888"
  firecrawl_url: "http://84.247.181.100:3002"
  smtp_host: "mail.lindela.io"    # 217.76.53.144 — Stalwart