<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Main gradient - vibrant purple to cyan -->
    <linearGradient id="main-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>

    <!-- Accent gradient - warm orange to pink -->
    <linearGradient id="accent-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>

    <!-- Document 1 gradient -->
    <linearGradient id="doc1-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>

    <!-- Document 2 gradient -->
    <linearGradient id="doc2-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7"/>
      <stop offset="100%" style="stop-color:#fde68a"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#main-gradient)"/>

  <!-- Inner glow ring -->
  <rect x="8" y="8" width="84" height="84" rx="18" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>

  <!-- Back document (slightly tilted left) -->
  <g transform="translate(50, 50) rotate(-8) translate(-50, -50)" filter="url(#shadow)">
    <rect x="22" y="18" width="40" height="52" rx="4" fill="url(#doc2-gradient)"/>
    <!-- Folded corner -->
    <path d="M52 18 L62 18 L62 28 Z" fill="#fcd34d"/>
    <!-- Text lines -->
    <rect x="28" y="28" width="24" height="2.5" rx="1" fill="#d97706" opacity="0.5"/>
    <rect x="28" y="34" width="20" height="2.5" rx="1" fill="#d97706" opacity="0.4"/>
    <rect x="28" y="40" width="22" height="2.5" rx="1" fill="#d97706" opacity="0.4"/>
  </g>

  <!-- Front document (slightly tilted right) -->
  <g transform="translate(50, 50) rotate(6) translate(-50, -50)" filter="url(#shadow)">
    <rect x="32" y="26" width="42" height="54" rx="4" fill="url(#doc1-gradient)"/>
    <!-- Folded corner -->
    <path d="M64 26 L74 26 L74 36 Z" fill="#e2e8f0"/>
    <!-- Text lines -->
    <rect x="38" y="38" width="28" height="3" rx="1.5" fill="#475569" opacity="0.6"/>
    <rect x="38" y="46" width="24" height="3" rx="1.5" fill="#64748b" opacity="0.4"/>
    <rect x="38" y="54" width="26" height="3" rx="1.5" fill="#64748b" opacity="0.4"/>
    <rect x="38" y="62" width="20" height="3" rx="1.5" fill="#64748b" opacity="0.4"/>
  </g>

  <!-- Fusion spark/energy burst in the center -->
  <g filter="url(#glow)">
    <!-- Central fusion point -->
    <circle cx="50" cy="52" r="8" fill="url(#accent-gradient)"/>
    <circle cx="50" cy="52" r="5" fill="white" opacity="0.9"/>

    <!-- Energy rays -->
    <g stroke="url(#accent-gradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
      <line x1="50" y1="40" x2="50" y2="34"/>
      <line x1="50" y1="64" x2="50" y2="70"/>
      <line x1="38" y1="52" x2="32" y2="52"/>
      <line x1="62" y1="52" x2="68" y2="52"/>
    </g>

    <!-- Diagonal sparks -->
    <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="42" y1="44" x2="38" y2="40"/>
      <line x1="58" y1="44" x2="62" y2="40"/>
      <line x1="42" y1="60" x2="38" y2="64"/>
      <line x1="58" y1="60" x2="62" y2="64"/>
    </g>
  </g>

  <!-- Corner sparkles -->
  <circle cx="18" cy="18" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="82" cy="82" r="2.5" fill="#34d399" opacity="0.9"/>
  <circle cx="84" cy="20" r="2" fill="#f472b6" opacity="0.8"/>
  <circle cx="16" cy="80" r="2" fill="#60a5fa" opacity="0.8"/>
</svg>
