# Competitive analyzer config schema.
# This file is JSON-compatible YAML so the analyzer can load it without adding a
# PyYAML runtime dependency. Keep comments on their own lines for the fallback parser.
#
# Top-level fields:
# - scoring_weights: factor weights for threat scoring. Env vars can override
#   these values, for example COMPETITIVE_WEIGHT_PRICE=0.3 or
#   COMPETITIVE_WEIGHT_WIN_RATE=0.25.
# - competitors: map of stable competitor slugs to profile objects.
# - market_segments: map of stable market slugs to market intelligence objects.
#
# Competitor profile fields:
# - name: display name.
# - tier: one of tier_1, tier_2, tier_3, unknown.
# - competitive_advantages: values from CompetitiveAdvantage, such as
#   scale_advantage, innovation_advantage, incumbent_advantage,
#   relationship_advantage, capability_advantage, cost_advantage,
#   domain_expertise, partnership_advantage.
# - core_capabilities: map of capability names to 0.0-1.0 strength scores.
