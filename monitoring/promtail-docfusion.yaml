          - 37.60.225.7
        labels:
          job: docfusion
          app: docfusion
          env: production
          instance: 37.60.225.7
          __path__: /var/log/docfusion/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            duration_ms: duration_ms
            source: source
            status: status
            opportunities_discovered: opportunities_discovered
            crawl_duration_seconds: crawl_duration_seconds
            quality_kept: quality_kept
            quality_total: quality_total
      - labels:
          level:
          source:
          status:
      - structured_metadata:
          level:
          duration_ms:
          source:
          status:
          opportunities_discovered:
          crawl_duration_seconds:
          quality_kept:
          quality_total:
