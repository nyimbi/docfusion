      - egypt_etenders
      - morocco_marches
      - tunisia_tuneps
      - ifc
      - adb
      - idb
      - ebrd
      - eu_devco

  # Tier 2: Medium-priority sources - every 12 hours
  tier2:
    cron: "0 */12 * * *"
    sources:
      - ted
      - dgmarket
      - rwanda_umucyo
      - ghana_ghaneps
      - tanzania_taneps
      - uganda_gpp
