# ============================================================================
# Global Settings
# ============================================================================

settings:
  # Default rate limit for sources without explicit config
  default_rate_limit: 1.0

  # Default timeout in seconds
  default_timeout: 30

  # Maximum retries per request
  max_retries: 3

  # Deduplication database path
  dedup_db_path: "data/discovery/dedup.sqlite"

  # Audit log path
  audit_log_path: "data/discovery/audit.jsonl"

  # Enable proxy rotation
  proxy_rotation_enabled: false

  # Proxy list (if enabled)
  proxies: []

  # User agent rotation
  user_agent_rotation_enabled: true
