# TenderSourceMax Source Registry
# ================================
#
# Configuration for all tender/RFP sources to scrape.
#
# Source Types:
#   - mdb: Multilateral Development Banks (World Bank, AfDB, IDB, ADB)
#   - un_agency: UN Agencies (UNDP, UNICEF, UNOPS, WHO, etc.)
#   - aggregator: Multi-source aggregators (UNGM, dgMarket, DevEx)
#   - government: National e-procurement portals
#   - regional: Regional organizations (EAC, SADC, AU, ECOWAS)
#   - bilateral: Bilateral donors (USAID, EU, DFID, GIZ)
#
# Schedule Tiers:
#   - tier1: Every 6 hours (high-priority, high-volume sources)
#   - tier2: Every 12 hours (medium-priority sources)
#   - tier3: Daily at 06:00 UTC (lower-priority sources)
#
# Priority Levels:
#   - 1: Critical (must always work)
#   - 2: Important (core functionality)
#   - 3: Nice to have (additional coverage)

# ============================================================================
# UN System & Aggregators (Tier 1 - High Priority)
# ============================================================================

sources:
  # UN Global Marketplace - Primary aggregator for all UN procurement
  - id: ungm
    name: "UN Global Marketplace"
    url: "https://www.ungm.org"
    type: aggregator
    coverage:
      - global
      - africa
    rate_limit: 1.0
    timeout: 30
    javascript: false
    auth: false
    priority: 1
    schedule_tier: 1
    scraper_class: "backend.discovery.scrapers.ungm.UNGMScraper"
    notes: |
      Central procurement portal for UN agencies.
      Covers UNOPS, UNDP, UNICEF, WHO, FAO, WFP, etc.
      Search API available with filters.

  # African Development Bank
  - id: afdb
    name: "African Development Bank"
    url: "https://www.afdb.org"
    type: mdb
    coverage:
      - africa
    rate_limit: 2.0
    timeout: 30
    javascript: false
    auth: false
    priority: 1
    schedule_tier: 1
    scraper_class: "backend.discovery.scrapers.afdb.AfDBScraper"
    notes: |
      Major funder of Africa infrastructure and development.
      Procurement notices at /en/business/opportunities

  # World Bank
  - id: worldbank
    name: "World Bank"
    url: "https://projects.worldbank.org"
    type: mdb
    coverage:
      - global
      - africa
    rate_limit: 0.5
    timeout: 60
    javascript: true
    auth: false
    priority: 1
    schedule_tier: 1
    scraper_class: "backend.discovery.scrapers.worldbank.WorldBankScraper"
    notes: |
      Major development finance institution.
      Requires Playwright for JavaScript rendering.
      Also check procurement.worldbank.org

  # TED Europa (Tenders Electronic Daily)
  - id: ted
    name: "TED Europa"
    url: "https://ted.europa.eu"
    type: aggregator
    coverage:
      - europe
      - africa
    rate_limit: 0.5
    timeout: 30
    javascript: false
    auth: false
    priority: 2
    schedule_tier: 2
    scraper_class: "backend.discovery.scrapers.ted.TEDScraper"
    notes: |
      EU procurement portal with RSS/XML feeds.
      Covers contracts above EU thresholds.
      CPV code filtering available.

  # dgMarket
  - id: dgmarket
    name: "dgMarket"
    url: "https://www.dgmarket.com"
    type: aggregator
    coverage:
      - global
      - africa
    rate_limit: 1.0
    timeout: 30
    javascript: false
    auth: false
    priority: 2
    schedule_tier: 2
    scraper_class: "backend.discovery.scrapers.dgmarket.DgMarketScraper"
    notes: |
      Development aid tender aggregator.
      May require CloudScraper for Cloudflare bypass.

