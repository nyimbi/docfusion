# ============================================================================
# Schedule Configuration
# ============================================================================

schedules:
  # Tier 1: High-priority sources - every 6 hours
  tier1:
    cron: "0 */6 * * *"
    sources:
      - ungm
      - afdb
      - worldbank
      - undp
      - kenya_ppip
      - sa_etenders
      - nigeria_bpp
      - dr_congo_sigmap
